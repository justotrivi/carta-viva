<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grupo Del Sol · Tres lugares, una misma Cartagena</title>
<meta name="description" content="Casa del Arzobispado, El Baluarte y Época Café. Entra y conoce los lugares de Grupo Del Sol en Cartagena.">
<meta property="og:title" content="Grupo Del Sol · Una invitación especial">
<meta property="og:description" content="Tres lugares, una misma Cartagena. Entra y vive la experiencia.">
<meta property="og:image" content="https://grupodelsolsas.com/wp-content/uploads/2017/10/slider05.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#120F0B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#120F0B;--bg2:#1B1610;--fg:#F4EDE1;--muted:#B5AA97;--gold:#C9A66B;--gold2:#E8CF9C;--line:rgba(201,166,107,.28)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:Montserrat,system-ui,sans-serif;font-weight:300;line-height:1.6;overflow-x:hidden}
.eyebrow{font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:500}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
em{font-style:italic;color:var(--gold2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.95rem 1.4rem;border-radius:999px;font:500 .72rem Montserrat,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;transition:transform .25s}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(120deg,#B28E52,#E8CF9C 45%,#B28E52);background-size:220% 100%;color:#1A140B;box-shadow:0 10px 30px -12px rgba(201,166,107,.8);animation:sheen 4s linear infinite}
@keyframes sheen{0%{background-position:100% 0}100%{background-position:-120% 0}}
.btn-ghost{border:1px solid rgba(255,255,255,.35);color:#fff;background:rgba(0,0,0,.3);backdrop-filter:blur(8px)}

/* Intro */
#intro{position:relative;height:100svh;min-height:620px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.4rem;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#2c2318 0%,#120F0B 62%)}
.sol{position:relative;width:min(48vw,34vh,240px);aspect-ratio:1;margin-bottom:1rem}
.sol svg{position:absolute;inset:0;width:100%;height:100%}
.rayos{animation:gira 60s linear infinite;transform-origin:50% 50%}
.rayos2{animation:gira 90s linear infinite reverse;transform-origin:50% 50%;opacity:.5}
@keyframes gira{to{transform:rotate(360deg)}}
.nucleo{position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F3DDAE,#C9A66B 55%,#8C6A35);box-shadow:0 0 80px 10px rgba(232,207,156,.35);animation:late 4s ease-in-out infinite;display:grid;place-items:center}
@keyframes late{50%{box-shadow:0 0 120px 24px rgba(232,207,156,.45);transform:scale(1.03)}}
.nucleo span{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:clamp(2rem,9vw,3.2rem);color:#2a1d0c}
.wm{width:min(62vw,280px);filter:invert(1) brightness(1.05);opacity:.92;margin:0 auto .9rem}
#intro h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(2.4rem,10vw,4.6rem);line-height:1.04}
#intro p{color:var(--muted);max-width:26rem;margin:.9rem auto 3.4rem;font-size:.95rem}
.baja{position:absolute;bottom:.6rem;left:50%;transform:translateX(-50%);font-size:.62rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.baja i{width:1px;height:42px;background:linear-gradient(var(--gold),transparent);animation:cae 1.8s infinite}
@keyframes cae{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.ent{opacity:0;transform:translateY(30px);animation:ent 1.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes ent{to{opacity:1;transform:none}}

/* Puertas */
#puertas{padding:2rem 1rem 4rem;max-width:1200px;margin:0 auto}
.tit{text-align:center;margin:2rem 0 2.2rem}
.tit h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(2.1rem,8vw,3.6rem);line-height:1.05;margin-top:.5rem}
.grid{display:grid;gap:1.4rem}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.puerta{position:relative;height:84svh;min-height:560px;max-height:820px;border-radius:260px 260px 22px 22px;overflow:hidden;color:#fff;isolation:isolate;box-shadow:0 30px 60px -30px #000;opacity:0;transform:translateY(60px) scale(.97);transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1)}
.puerta.in{opacity:1;transform:none}
.puerta .fx{position:absolute;inset:0}
.puerta .fx div{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.15);transition:opacity 1.5s}
.puerta .fx div.on{opacity:1;animation:kb 7s linear forwards}
@keyframes kb{from{transform:scale(1.15)}to{transform:scale(1.02) translate(-1.5%,1%)}}
.puerta .fx .sh{opacity:1!important;transform:none!important;animation:none!important;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.88) 100%)}
.puerta .borde{position:absolute;inset:10px;border:1px solid rgba(232,207,156,.45);border-radius:250px 250px 16px 16px;pointer-events:none}
.puerta .tx{position:absolute;left:0;right:0;bottom:0;padding:1.6rem 1.5rem 1.8rem;text-align:center}
.puerta .num{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold2)}
.puerta .lg{height:74px;margin:.4rem auto .6rem;mix-blend-mode:screen}
.puerta .k{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold2)}
.puerta h3{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(2.2rem,9vw,2.9rem);line-height:1;margin:.3rem 0 .6rem}
.puerta p{font-size:.86rem;color:#e6ddcd;max-width:22rem;margin:0 auto 1.2rem}
.puerta .row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.puerta a.cubre{position:absolute;inset:0}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin-bottom:1rem}
.chips span{font-size:.6rem;letter-spacing:.08em;border:1px solid rgba(232,207,156,.4);border-radius:99px;padding:.25rem .6rem;background:rgba(0,0,0,.25)}

/* Línea de tiempo */
#tiempo{padding:5rem 1.4rem;background:var(--bg2);border-block:1px solid var(--line)}
.tl{max-width:760px;margin:2.4rem auto 0;position:relative}
.tl:before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1px;background:var(--line)}
.tl .lin{position:absolute;left:18px;top:0;width:1px;background:var(--gold);height:0;transition:height .2s linear}
.hito{position:relative;padding:0 0 2.6rem 3.4rem;opacity:.25;transition:opacity .8s}
.hito.in{opacity:1}
.hito:before{content:"";position:absolute;left:11px;top:.7rem;width:15px;height:15px;border-radius:50%;border:1px solid var(--gold);background:var(--bg2);transition:background .6s,box-shadow .6s}
.hito.in:before{background:var(--gold);box-shadow:0 0 0 6px rgba(201,166,107,.18)}
.hito b{font-family:"Cormorant Garamond",serif;font-size:2.8rem;font-weight:500;color:var(--gold2);line-height:1}
.hito h4{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:1.5rem;margin:.2rem 0}
.hito p{color:var(--muted);font-size:.9rem}

/* Final */
#final{position:relative;min-height:90svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 1.4rem;overflow:hidden}
#final .bgi{position:absolute;inset:0;background:url(https://grupodelsolsas.com/wp-content/uploads/2017/08/header01-1.jpg) center/cover;animation:kb 18s linear infinite alternate}
#final:before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at center,rgba(18,15,11,.72),rgba(18,15,11,.96))}
#final .in{position:relative;z-index:2;max-width:560px}
#final h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(2.6rem,11vw,4.8rem);line-height:1.04;margin:.6rem 0 1rem}
#final p{color:var(--muted)}
.tres{display:flex;gap:1rem;justify-content:center;margin:2rem 0 1.6rem;flex-wrap:wrap}
.tres a{display:flex;flex-direction:column;align-items:center;gap:.5rem;text-decoration:none;color:var(--fg);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}
.tres a span{width:86px;height:86px;border-radius:50%;background-size:cover;background-position:center;border:1px solid var(--gold);box-shadow:0 0 0 5px rgba(201,166,107,.12);transition:transform .4s}
.tres a:hover span{transform:scale(1.08) rotate(-3deg)}
.by{margin-top:2.4rem;font-size:.6rem;letter-spacing:.2em;color:#6f6556}.by b{color:#F5C518}
.prog{position:fixed;top:0;left:0;height:2px;background:var(--gold);z-index:60;width:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.puerta,.hito{opacity:1;transform:none}}
</style>
</head>
<body>
<script>
const T={
es:{soy:' (Soy {n})',saludo:'Una invitación especial',saludoN:'{n}, esta invitación es para ti',
 h1:'Tres lugares,<br><em>una misma Cartagena</em>',intro:'Un hotel boutique del siglo XVII, un bar sobre la muralla frente al mar y el primer café de autor de la ciudad. Elige por dónde empezar.',entrar:'Entrar',
 peye:'Grupo Del Sol · Desde 1987',ptit:'Toca una puerta <em>y entra</em>',

  {k:'Hotel boutique · Siglo XVII',d:'Once habitaciones con alma propia, piscina entre jardines, Spa Las Indias y la Catedral al lado.',chips:['Hospedaje','Spa','Piscina','Isla Bonita'],b:'Reservar estadía',w:'Hola, recibí la invitación de Grupo Del Sol y quiero reservar en Casa del Arzobispado.'},
  {k:'Bar · Restaurante · Tapas',d:'Sobre la muralla, frente al mar: atardeceres, cocteles de autor, tapas del Caribe y música en vivo.',chips:['Atardecer','Cocteles','Música en vivo'],b:'Reservar mesa',w:'Hola, recibí la invitación de Grupo Del Sol y quiero reservar una mesa en El Baluarte.'},
  {k:'All-day café bar · Desde 2017',d:'El primer café de autor de Cartagena: cafés de origen, brunch y cocteles clásicos.',chips:['Brunch','Café de origen','Cocteles'],b:'Reservar mesa',w:'Hola, recibí la invitación de Grupo Del Sol y quiero reservar una mesa en Época Café.'}],

 hitos:[['1987','El Baluarte San Francisco Javier','Todo empezó en uno de los baluartes más bellos de la muralla, construido hacia 1630.'],['2004','Casa del Arzobispado','Una casona colonial del siglo XVII se convierte en hotel boutique frente a la Catedral.'],['2017','Época Café','Nace el primer café de autor de Cartagena, con su La Pavoni original de los años 50.'],['Hoy','Tu próxima historia','Hospedaje, atardeceres, café y eventos en el corazón de la ciudad amurallada.']],

en:{soy:' (My name is {n})',saludo:'A special invitation',saludoN:'{n}, this invitation is for you',
 h1:'Three places,<br><em>one Cartagena</em>',intro:'A 17th-century boutique hotel, a bar on the city walls facing the sea and the city’s first specialty café. Choose where to begin.',entrar:'Enter',
 peye:'Grupo Del Sol · Since 1987',ptit:'Open a door <em>and step in</em>',

  {k:'Boutique hotel · 17th century',d:'Eleven rooms with a soul of their own, a garden pool, Spa Las Indias and the Cathedral next door.',chips:['Stay','Spa','Pool','Isla Bonita'],b:'Book a stay',w:'Hi, I received the Grupo Del Sol invitation and I’d like to book at Casa del Arzobispado.'},
  {k:'Bar · Restaurant · Tapas',d:'On the city walls, facing the sea: sunsets, signature cocktails, Caribbean tapas and live music.',chips:['Sunset','Cocktails','Live music'],b:'Book a table',w:'Hi, I received the Grupo Del Sol invitation and I’d like to book a table at El Baluarte.'},

</script>
<script src="/invitaciones/i18n.js"></script>
<div class="prog" id="prog"></div>

<section id="intro">
  <div class="sol ent">
    <svg class="rayos" viewBox="0 0 200 200" aria-hidden="true"><g id="r"></g></svg>
    <svg class="rayos2" viewBox="0 0 200 200" aria-hidden="true"><g id="r2"></g></svg>
    <div class="nucleo"><span>DS</span></div>
  </div>
  <img class="wm ent" style="animation-delay:.25s" src="https://grupodelsolsas.com/wp-content/uploads/2017/08/logo.png" alt="Grupo Del Sol">
  <div class="eyebrow ent" style="animation-delay:.4s" id="saludo"></div>
  <h1 class="ent" style="animation-delay:.55s" data-i="h1"></h1>
  <p class="ent" style="animation-delay:.7s" data-i="intro"></p>
  <a href="#puertas" class="baja"><span data-i="entrar"></span><i></i></a>
</section>

<section id="puertas">
  <div class="tit"><div class="eyebrow" data-i="peye"></div><h2 data-i="ptit"></h2></div>
  <div class="grid" id="grid"></div>
</section>

<section id="tiempo">
  <div style="text-align:center"><div class="eyebrow" data-i="teye"></div><h2 class="serif" style="font-weight:500;font-size:clamp(2.1rem,8vw,3.4rem);line-height:1.05;margin-top:.5rem" data-i="ttit"></h2></div>
  <div class="tl" id="tl"><div class="lin" id="lin"></div><div id="hitos"></div></div>
</section>

<section id="final"><div class="bgi"></div>
  <div class="in">
    <div class="eyebrow" data-i="feye"></div>
    <h2 data-i="ftit"></h2>
    <p data-i="ftxt"></p>
    <div class="tres" id="tres"></div>
    <a class="btn btn-gold" id="waGen" target="_blank" rel="noopener" data-i="fcta"></a>
    <div class="by" data-i="by"></div>
  </div>
</section>

<script>
const G='https://grupodelsolsas.com/wp-content/uploads/2017/',H=i=>`https://synergy.booking-channel.com/api/hotels/2446/medias/${i}`,E='https://cdn.shopify.com/s/files/1/0270/8193/2865/t/2/assets/';
const WA='573175098738';
const wa=t=>waLink(WA,t);
const ray=(id,n,l,w)=>{let s='';for(let i=0;i<n;i++){const a=i*360/n;s+=`<rect x="${100-w/2}" y="${100-l}" width="${w}" height="${l-56}" rx="${w/2}" fill="url(#gg)" transform="rotate(${a} 100 100)"/>`}document.getElementById(id).innerHTML=`<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8CF9C" stop-opacity="0"/><stop offset="1" stop-color="#C9A66B"/></linearGradient></defs>`+s};
ray('r',24,98,3);ray('r2',48,90,1.2);
const P=[
 {href:'/arzobispado',n:'Casa del Arzobispado',corto:'Arzobispado',lg:null,f:[G+'10/slider05.jpg',H(101),H(195),H(121)]},
 {href:'/baluarte',n:'El Baluarte',corto:'El Baluarte',lg:G+'08/baluarte_logo.gif',f:[G+'08/baluarte_02.jpg',G+'08/baluarte_01.jpg',H(355)]},
 {href:'/epoca',n:'Época Café',corto:'Época Café',lg:G+'08/epoca_logo.gif',f:[G+'10/slider03.jpg',E+'01_756G.jpg',H(113),'https://epocacafe.co/cdn/shop/files/cafe2_2048x.png']}];
let t=0,vistos=new Set();
function render(){const L=T[LANG]||T.es;
 document.getElementById('saludo').textContent=nombre?L.saludoN.replace('{n}',nombre):L.saludo;
 document.getElementById('grid').innerHTML=P.map((p,i)=>{const x=L.puertas[i];return `<article class="puerta${vistos.size?' in':''}" style="transition-delay:${i*.12}s"><div class="fx">${p.f.map((f,j)=>`<div class="${j===t%p.f.length?'on':''}" style="background-image:url(${f})"></div>`).join('')}<div class="sh"></div></div><a class="cubre" href="${link(p.href)}" aria-label="${p.n}"></a><div class="borde"></div><div class="tx"><div class="num">0${i+1} / 03</div>${p.lg?`<img class="lg" src="${p.lg}" alt="">`:''}<div class="k">${x.k}</div><h3>${p.n}</h3><p>${x.d}</p><div class="chips">${x.chips.map(c=>`<span>${c}</span>`).join('')}</div><div class="row"><a class="btn btn-gold" href="${link(p.href)}">${L.entrar}</a><a class="btn btn-ghost" target="_blank" rel="noopener" href="${wa(x.w)}">${x.b}</a></div></div></article>`}).join('');
 document.getElementById('hitos').innerHTML=L.hitos.map((h,i)=>`<div class="hito${vistos.size?' in':''}"${i===3?' style="padding-bottom:0"':''}><b>${h[0]}</b><h4>${h[1]}</h4><p>${h[2]}</p></div>`).join('');
 document.getElementById('tres').innerHTML=P.map(p=>`<a href="${link(p.href)}"><span style="background-image:url(${p.f[0]})"></span>${p.corto}</a>`).join('');
 document.getElementById('waGen').href=wa(L.wGen);
 document.querySelectorAll('.puerta,.hito').forEach(e=>{if(!e.classList.contains('in'))io.observe(e)})}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');vistos.add(1);io.unobserve(e.target)}}),{threshold:.12});
setLang(LANG,false);
setInterval(()=>{t++;document.querySelectorAll('.puerta .fx').forEach(fx=>{const ph=[...fx.children].filter(x=>!x.classList.contains('sh'));ph.forEach((x,i)=>x.classList.toggle('on',i===t%ph.length))})},4200);
const tl=document.getElementById('tl'),lin=document.getElementById('lin'),prog=document.getElementById('prog');
addEventListener('scroll',()=>requestAnimationFrame(()=>{const h=innerHeight;prog.style.width=(scrollY/(document.documentElement.scrollHeight-h)*100)+'%';const r=tl.getBoundingClientRect();lin.style.height=Math.max(0,Math.min(r.height,h*.7-r.top))+'px'}),{passive:true});
</script>
